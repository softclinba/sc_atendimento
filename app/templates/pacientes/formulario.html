{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if paciente else 'Novo' }} Paciente - SOFT Clínica{% endblock %}
{% block conteudo %}

<h1 class="page-title">{{ 'Editar paciente' if paciente else 'Novo paciente' }}</h1>

<form method="post" class="card formulario" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="campo">
    <label for="nome">Nome do paciente *</label>
    <input type="text" id="nome" name="nome" class="form-control" required value="{{ paciente.nome if paciente else '' }}">
  </div>
  <div class="acoes">
    <a href="{{ url_for('pacientes.lista') }}" class="btn btn-limpar">Cancelar</a>
    <button type="submit" class="btn btn-ok">Salvar</button>
  </div>
</form>

{% endblock %}
