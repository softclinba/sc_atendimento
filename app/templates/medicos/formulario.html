{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if medico else 'Novo' }} Médico - SOFT Clínica{% endblock %}
{% block conteudo %}

<h1 class="page-title">{{ 'Editar médico' if medico else 'Novo médico' }}</h1>

<form method="post" class="card formulario" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="campo">
    <label for="nome">Nome do médico *</label>
    <input type="text" id="nome" name="nome" class="form-control" required value="{{ medico.nome if medico else '' }}">
  </div>
  <div class="acoes">
    <a href="{{ url_for('medicos.lista') }}" class="btn btn-limpar">Cancelar</a>
    <button type="submit" class="btn btn-ok">Salvar</button>
  </div>
</form>

{% endblock %}
