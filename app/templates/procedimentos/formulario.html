{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if procedimento else 'Novo' }} Procedimento - SOFT Clínica{% endblock %}
{% block conteudo %}

<h1 class="page-title">{{ 'Editar procedimento' if procedimento else 'Novo procedimento' }}</h1>

<form method="post" class="card formulario" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="campo">
    <label for="nome">Nome do procedimento *</label>
    <input type="text" id="nome" name="nome" class="form-control" required value="{{ procedimento.nome if procedimento else '' }}">
  </div>
  <div class="campo">
    <label for="valor">Valor *</label>
    <div class="moeda">
      <span>R$</span>
      <input type="text" id="valor" name="valor" class="form-control mascara-moeda" inputmode="decimal" required placeholder="0,00" value="{{ procedimento.valor_float|brnum if procedimento else '' }}">
    </div>
    <small class="text-muted">Ex.: 1.500,00</small>
  </div>
  <div class="acoes">
    <a href="{{ url_for('procedimentos.lista') }}" class="btn btn-limpar">Cancelar</a>
    <button type="submit" class="btn btn-ok">Salvar</button>
  </div>
</form>

{% endblock %}
